<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  <!-- Ad-Connect Node Network Graphic -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Interconnecting Lines -->
    <path d="M 120,240 L 272,120 L 272,360 L 120,240 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" opacity="0.2" />
    <path d="M 272,120 L 392,240 L 272,360" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" opacity="0.2" />
    <line x1="120" y1="240" x2="392" y2="240" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,8" opacity="0.4" />
    
    <!-- Nodes -->
    <!-- Primary Node (Central Platform) -->
    <circle cx="272" cy="240" r="50" fill="url(#grad2)" stroke="#ffffff" stroke-width="6" />
    <circle cx="272" cy="240" r="20" fill="#ffffff" />
    
    <!-- Creator Node (Green / Success) -->
    <circle cx="120" cy="240" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4" />
    <path d="M 112,240 L 118,246 L 128,234" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Advertiser Node (Purple / Info) -->
    <circle cx="392" cy="240" r="32" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <path d="M 384,232 L 400,248 M 400,232 L 384,248" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Minor Nodes (Outer Circles) -->
    <circle cx="272" cy="120" r="20" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <circle cx="272" cy="360" r="20" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
    
    <!-- Glow Effect Accents -->
    <circle cx="272" cy="240" r="80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-dasharray="5,15" />
  </g>
</svg>
